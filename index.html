<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Il mio video</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    video {
      width: 100%;
      max-height: 85vh;
    }

    button {
      margin: 20px;
      padding: 16px 24px;
      font-size: 18px;
      border: 0;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline controls>
    <source src="https://res.cloudinary.com/fsodla0e/video/upload/v1793093620/1000184474.mp4" type="video/mp4">
    Il tuo browser non supporta il video.
  </video>

  <button id="audio">🔊 Attiva audio</button>

  <script>
    const video = document.getElementById("video");
    const button = document.getElementById("audio");

    video.play().catch(() => {});

    button.addEventListener("click", async () => {
      video.muted = false;

      try {
        await video.play();
        button.hidden = true;
      } catch {
        video.muted = true;
        alert("Il browser non ha consentito la riproduzione con audio.");
      }
    });
  </script>
</body>
</html>
