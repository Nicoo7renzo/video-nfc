<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Il mio video</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 760px); text-align: center; }
    h1 { margin: 0 0 18px; font-size: clamp(1.4rem, 4vw, 2rem); }
    video {
      display: block;
      width: 100%;
      max-height: 78vh;
      background: #000;
      border-radius: 14px;
    }
    #status { min-height: 1.5em; margin-top: 14px; color: #ddd; }
  </style>
</head>
<body>
  <main>
    <h1>Il mio video</h1>
    <video id="video" controls autoplay playsinline preload="auto">
      <source src="https://res.cloudinary.com/fsodla0e/video/upload/v1793093620/1000184474.mp4" type="video/mp4">
      Il tuo browser non supporta la riproduzione video HTML5.
    </video>
    <p id="status" aria-live="polite"></p>
  </main>
  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    video.muted = false;
    video.play().then(() => {
      status.textContent = '';
    }).catch(() => {
      status.textContent = 'Se il video non parte automaticamente, premi Play.';
    });
  </script>
</body>
</html>
