<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Il mio video</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: white;
      font-family: system-ui, sans-serif;
    }

    main {
      width: 100%;
      max-width: 900px;
      padding: 16px;
      text-align: center;
    }

    video {
      display: block;
      width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      background: #000;
    }

    button {
      margin-top: 16px;
      padding: 16px 28px;
      border: 0;
      border-radius: 999px;
      background: white;
      color: black;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    #playButton {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <video id="video" controls playsinline preload="auto">
      <source src="https://res.cloudinary.com/fsodla0e/video/upload/v1793093620/1000184474.mp4" type="video/mp4">
      Il tuo browser non supporta la riproduzione video.
    </video>
    <button id="playButton" type="button">▶ Guarda il video</button>
  </main>

  <script>
    const video = document.getElementById("video");
    const playButton = document.getElementById("playButton");

    video.muted = true;

    video.play().then(() => {
      video.muted = false;
    }).catch(() => {
      playButton.style.display = "inline-block";
    });

    playButton.addEventListener("click", async () => {
      video.muted = false;
      try {
        await video.play();
        playButton.style.display = "none";
      } catch {
        playButton.textContent = "Tocca Play sul video";
      }
    });

    video.addEventListener("play", () => {
      playButton.style.display = "none";
    });
  </script>
</body>
</html>
